# VulkanEnumCheck exceptions
#
# Lines are:   subset  <TvgType>             the type holds only some of the Vulkan values on purpose:
#                                            existing lines are still checked, missing values are not reported
#              skip    <TvgType>             do not check this type at all
#              ignore  <TvgType> <VK_NAME>   a Vulkan value you have decided not to add
#              ignore  * <VK_NAME>           ... for every type
#              name    <VK_NAME> <ShortName> the short name to use when this value is added
#
# Lines starting with # or // are comments.

# Only the depth (and depth/stencil) formats, not all of TVkFormat
subset TvgDepthBufferFormat
subset TvgDepthStencilBufferFormat

# Examples
# ignore TvgDependencyFlagBits VK_DEPENDENCY_EXTENSION_586_BIT_IMG
# name   VK_IMAGE_LAYOUT_RENDERING_LOCAL_READ  RENDERING_LOCAL_READ
